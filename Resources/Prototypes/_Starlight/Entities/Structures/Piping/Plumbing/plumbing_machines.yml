# Base plumbing machine entity - all plumbing machines inherit from this
- type: entity
  abstract: true
  id: PlumbingMachineBase
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: false
  - type: Sprite
    noRot: false  # Allow rotation so connectors face correct direction
  - type: Clickable
  - type: Appearance
  - type: PlumbingConnectorAppearance
    offset: 0.09375
  - type: InteractionOutline
  - type: Anchorable
  - type: Pullable
  - type: Rotatable
    rotateWhileAnchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: -0.25,-0.25,0.25,0.25
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: AtmosPipeColor
  - type: RCDDeconstructable
    cost: 2
    delay: 2
    fx: EffectRCDDeconstruct2
    rpld: true
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic

# =============================================================================
# Plumbing Tank - stores reagents in the network
# =============================================================================
- type: entity
  parent: PlumbingMachineBase
  id: PlumbingTank
  name: резервуар для водопровода
  description: Резервуар, который забирает реагенты через входное отверстие (северное) и вмещает до 400u. Другие машины могут забирать реагенты через его выходные отверстия (южное, восточное, западное).
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Piping/Plumbing/plumbers.rsi
    layers:
    - state: tank
  - type: PlumbingDevice
    updateInterval: 2
  - type: PlumbingInlet
    solutionName: tank
  - type: Plungeable
  - type: PlumbingOutlet
    solutionName: tank
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 400
        canReact: false
  - type: ExaminableSolution
    solution: tank
  - type: NodeContainer
    nodes:
      inlet:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: North
      outlet:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: TSouth
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpillBehavior
        solution: tank
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
    price: 100

# =============================================================================
# Plumbing Input - pour reagents into the network
# =============================================================================
- type: entity
  parent: PlumbingMachineBase
  id: PlumbingInput
  name: водопроводный ввод
  description: Небольшой резервуар, в который заливаются реагенты. Другие приборы забирают из него реагенты. Подключается во всех направлениях.
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Piping/Plumbing/plumbers.rsi
    layers:
    - state: pipe_input
  - type: PlumbingInput
    solutionName: input
  - type: Plungeable
  - type: PlumbingOutlet
    solutionName: input
  - type: SolutionContainerManager
    solutions:
      input:
        maxVol: 100
        canReact: false
  - type: ExaminableSolution
    solution: input
  - type: NodeContainer
    nodes:
      outlet:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: Fourway
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpillBehavior
        solution: input
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
    price: 75

# =============================================================================
# Plumbing Sink - draws reagents from the network, has an outlet for solutions dumped into it
# =============================================================================
- type: entity
  parent: PlumbingMachineBase
  id: PlumbingSink
  name: водопроводная раковина
  description: Раковина, подключенная к водопроводной сети. Реагенты можно набирать из неё с помощью ёмкости или выливать в неё, чтобы они стекали в канализацию. Подключается во всех направлениях.
  components:
  - type: Sprite
    sprite: Structures/Furniture/sink.rsi
    drawdepth: FloorObjects
    layers:
    - state: sink_wide
  - type: Rotatable
    rotateWhileAnchored: false
  - type: PlumbingDevice
    updateInterval: 2
  - type: PlumbingInlet
    solutionName: output
    inletNames:
    - inletNorth
    - inletEast
    - inletWest
  - type: PlumbingOutput
    solutionName: output
  - type: PlumbingOutlet
    solutionName: drain
  - type: DumpableSolution
    solution: drain
  - type: Plungeable
  - type: SolutionContainerManager
    solutions:
      output:
        maxVol: 100
        canReact: false
      drain:
        maxVol: 100
        canReact: false
  - type: ExaminableSolution
    solution: output
  - type: NodeContainer
    nodes:
      inletNorth:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: North
      inletEast:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: East
      inletWest:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: West
      outlet:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: South
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpillBehavior
        solution: output
      - !type:SpillBehavior
        solution: drain
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
    price: 100

# =============================================================================
# Plumbing Output - draw reagents from the network
# =============================================================================
- type: entity
  parent: PlumbingMachineBase
  id: PlumbingOutput
  name: водопроводный вывод
  description: Небольшой резервуар, из которого отбираются реагенты из сети. Забор реагентов осуществляется с помощью емкости. Соединяется во всех направлениях.
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Piping/Plumbing/plumbers.rsi
    layers:
    - state: pipe_output
  - type: PlumbingDevice
    updateInterval: 2
  - type: PlumbingInlet
    solutionName: output
    inletNames:
    - inletNorth
    - inletEast
    - inletSouth
    - inletWest
  - type: PlumbingOutput
    solutionName: output
  - type: Plungeable
  - type: SolutionContainerManager
    solutions:
      output:
        maxVol: 100
        canReact: false
  - type: ExaminableSolution
    solution: output
  - type: NodeContainer
    nodes:
      inletNorth:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: North
      inletEast:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: East
      inletSouth:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: South
      inletWest:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: West
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpillBehavior
        solution: output
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
    price: 75

# =============================================================================
# Plumbing Reactor - accumulates reagents and triggers reactions
# =============================================================================
- type: entity
  parent: PlumbingMachineBase
  id: PlumbingReactor
  name: водопроводный реактор
  description: Забирает целевые реагенты из входного отверстия (север) и запускает реакции при достижении целевых показателей. Продукты доступны на выходном отверстии (юг).
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Piping/Plumbing/plumbers.rsi
    layers:
    - state: reaction_chamber
      map: [ "enum.PlumbingVisualLayers.Base" ]
  - type: GenericVisualizer
    visuals:
      enum.PlumbingVisuals.Running:
        enum.PlumbingVisualLayers.Base:
          True: { state: reaction_chamber_on }
          False: { state: reaction_chamber }
  - type: PlumbingDevice
    updateInterval: 2
  - type: PlumbingReactor
    bufferSolutionName: buffer
    outputSolutionName: output
    inletName: inlet
  - type: Plungeable
  - type: PlumbingOutlet
    solutionName: output
  - type: SolutionContainerManager
    solutions:
      buffer:
        maxVol: 100
        canReact: false  # Reactions triggered manually when targets met
      output:
        maxVol: 100
        canReact: false
  - type: ExaminableSolution
    solution: output
  - type: NodeContainer
    nodes:
      inlet:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: North
      outlet:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: South
  - type: UserInterface
    interfaces:
      enum.PlumbingReactorUiKey.Key:
        type: PlumbingReactorBoundUserInterface
  - type: ActivatableUI
    key: enum.PlumbingReactorUiKey.Key
  - type: ApcPowerReceiver
    powerLoad: 750
  - type: ExtensionCableReceiver
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpillBehavior
        solution: buffer
      - !type:SpillBehavior
        solution: output
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
    price: 150

# =============================================================================
# Plumbing Smart Fridge - stores reagents from the network, fills labeled jugs
# =============================================================================
- type: entity
  parent: PlumbingMachineBase
  id: PlumbingSmartFridge
  name: умный холодильник с водопроводом
  description: Умный холодильник, подключаемый к водопроводу. Получает все реагенты из сети и хранит до 200u каждого. Вставляется промаркированная емкость для наполнения холодильника соответствующим реагентом.
  components:
  - type: Sprite
    sprite: Structures/Machines/smartfridge.rsi
    layers:
    - state: smartfridge
      map: ["enum.StorageVisualLayers.Base"]
    - state: smartfridge_door
      map: ["enum.StorageVisualLayers.Door"]
      shader: unshaded
  - type: PointLight
    radius: 1.2
    energy: 3.0
    color: "#9dc5c9"
  - type: PlumbingDevice
    updateInterval: 2
  - type: PlumbingInlet
    solutionName: fridge
    inletNames:
    - inletNorth
    - inletEast
    - inletSouth
    - inletWest
  - type: PlumbingSmartFridge
    solutionName: fridge
    maxPerReagent: 200
  - type: SolutionContainerManager
    solutions:
      fridge:
        maxVol: 50000
        canReact: false
  - type: ExaminableSolution
    solution: fridge
  - type: NodeContainer
    nodes:
      inletNorth:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: North
      inletEast:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: East
      inletSouth:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: South
      inletWest:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: West
  - type: UserInterface
    interfaces:
      enum.PlumbingSmartFridgeUiKey.Key:
        type: PlumbingSmartFridgeBoundUserInterface
  - type: ActivatableUI
    key: enum.PlumbingSmartFridgeUiKey.Key
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: ExtensionCableReceiver
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:SpillBehavior
        solution: fridge
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
    price: 200

