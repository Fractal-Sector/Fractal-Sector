# =============================================================================
# Plumbing Drain - floor drain that outputs to plumbing network
# =============================================================================
- type: entity
  parent: PlumbingMachineBase
  id: PlumbingDrain
  name: слив водопровода
  description: Напольный слив, который впитывает лужи и направляет их в водопроводную сеть, вместо того чтобы удалять их.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    drawdepth: FloorObjects
    sprite: Objects/Specific/Janitorial/drain.rsi
    layers:
    - state: icon
    - map: [ "enum.SolutionContainerLayers.Fill" ]
      state: fill-1
      visible: false
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Fixtures
    fixtures: {}
  - type: AmbientSound
    enabled: false
    volume: -8
    range: 8
    sound:
      path: /Audio/Ambience/Objects/drain.ogg
  - type: Drain
    unitsDestroyedPerSecond: 0
  - type: DumpableSolution
    solution: drainBuffer
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    fillBaseName: fill-
    solutionName: drainBuffer
  - type: PlumbingOutlet
    solutionName: drainBuffer
  - type: SolutionContainerManager
    solutions:
      drainBuffer:
        maxVol: 400
  - type: NodeContainer
    nodes:
      outlet:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: Fourway
  - type: ExaminableSolution
    solution: drainBuffer
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpillBehavior
        solution: drainBuffer
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
    price: 150
