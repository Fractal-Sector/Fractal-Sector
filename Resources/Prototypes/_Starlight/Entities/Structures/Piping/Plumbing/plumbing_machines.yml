# =============================================================================
# Plumbing Filter - separates specific reagents into two outputs
# =============================================================================
- type: entity
  parent: PlumbingMachineBase
  id: PlumbingFilter
  name: водопроводный фильтр
  description: Фильтрует определенные реагенты. Забирает из входного отверстия (северное). Фильтрованные реагенты поступают на западный выход, нефильтрованные — на южный.
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Piping/Plumbing/plumbers.rsi
    layers:
    - state: filter
  - type: PlumbingDevice
    updateInterval: 2
  - type: PlumbingInlet
    solutionName: buffer
  - type: PlumbingFilter
    filterNodeName: outletFilter
    passthroughNodeName: outletPassthrough
    bufferSolutionName: buffer
  - type: Plungeable
  - type: PlumbingOutlet
    solutionName: buffer
    outletNames:
    - outletFilter
    - outletPassthrough
  - type: SolutionContainerManager
    solutions:
      buffer:
        maxVol: 40
        canReact: false
  - type: ExaminableSolution
    solution: buffer
  - type: NodeContainer
    nodes:
      inlet:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: North
      outletFilter:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: West
      outletPassthrough:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: South
  - type: AtmosPipeColor
    color: "#8B4513"
  - type: UserInterface
    interfaces:
      enum.PlumbingFilterUiKey.Key:
        type: PlumbingFilterBoundUserInterface
  - type: ActivatableUI
    key: enum.PlumbingFilterUiKey.Key
  - type: Flippable
    mirrorEntity: PlumbingFilterFlipped
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpillBehavior
        solution: buffer
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
    price: 125

- type: entity
  parent: PlumbingFilter
  id: PlumbingFilterFlipped
  suffix: Flipped
  description: Фильтрует определенные реагенты. Забирает из входного отверстия (южное). Фильтрованные реагенты поступают на западный выход, нефильтрованные — на северный.
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Piping/Plumbing/plumbers.rsi
    layers:
    - state: filterF
  - type: NodeContainer
    nodes:
      inlet:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: South
      outletFilter:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: West
      outletPassthrough:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: North
  - type: Flippable
    mirrorEntity: PlumbingFilter

