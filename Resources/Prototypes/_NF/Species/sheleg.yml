- type: species
  id: Sheleg
  name: species-name-sheleg
  roundStart: true
  prototype: MobSheleg
  dollPrototype: MobShelegDummy
  markingLimits: MobHumanMarkingLimits #MobShelegMarkingLimits WF
  sprites: MobShelegSprites
  skinColoration: Hues # Wayfarer: ShelegToned<Hues
  defaultSkinTone: "#2A48CC"
  forcedMarkingColor: "#FFFFFF"
  maleFirstNames: NamesShelegFirstMale
  femaleFirstNames: NamesShelegFirstFemale
  lastNames: NamesShelegLast
  youngAge: 80
  oldAge: 400
  maxAge: 800
  # FS: species window
  category: Unusual
  description: "/ServerInfo/_FS/Guidebook/Mobs/Sheleg.xml"
  pros:
  - Полный иммунитет к холоду, а также на 20% меньше урона от тупых, рубящих и колющих ударов.
  - Обладают повышенной устойчивостью к толчкам (их труднее сбить с ног).
  - Низкая температура тела никак не снижает скорость их ходьбы или бега.
  - Пока они остаются живы, их организм пассивно и постепенно залечивает урон от тепла.
  special:
  - Температура тела составляет -172 °C, что обязывает носить скафандр EVA в стандартной атмосфере (выдается на старте).
  - Кровь полностью состоит из криоксадона.
  - Вдыхают кислород, но выдыхают чистый водяной пар.
  - Полностью отсутствует трение о пол, если персонаж передвигается без обуви.
  cons:
  - Их гораздо тяжелее переносить, поднимать и тащить другим членам экипажа.
  - Получают на 65% больше урона от тепла и на 25% больше урона от электрического шока.
  - Начинают получать огромный урон от тепла, как только температура их тела поднимается выше 0 °C.
  - Способны перерабатывать строго по одному химическому веществу за раз.
  - Голод наступает медленнее, однако жажда накапливается значительно быстрее.
  - Смертельно опасная реакция с калием, прикосновение наносит раны, а употребление внутрь растворяет их.
  # FS end

