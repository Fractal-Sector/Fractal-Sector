- type: pointOfInterest
  id: Edison
  parent: BasePOI
  name: 'Электростанция Эдисона'
  minimumDistance: 3650
  maximumDistance: 5400
  minimumClearance: 1000
  spawnGroup: Required
  gridPath: /Maps/_NF/POI/edison.yml
  addComponents:
  - type: IFF
    color: "#3737F8"
  - type: SolarPoweredGrid
    trackOnInit: true
    doNotCull: true

- type: gameMap
  id: Edison
  mapName: 'Электростанция Эдисона'
  mapPath: /Maps/_NF/POI/edison.yml
  minPlayers: 0
  stations:
    Edison:
      stationProto: RecordsFrontierOutpost
      gridComponents:
      - type: VesselInfo # WF
        description: "Проблемы казались неразрешимыми. Но мы были инженерами, а инженеры могут сделать практически все, что угодно." # NASA engineer quote
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Электростанция Эдисона'
        - type: ExtraStationInformation
          icon: /Textures/_NF/Interface/StationIcons/banner_engineering.png
          stationSubtext: frontier-lobby-edison-subtext
          stationDescription: frontier-lobby-edison-description
          lobbySortOrder: 5
        - type: StationJobs
          availableJobs:
            PlantManager: [ 1, 1 ]
            PlantTechnician: [ 2, 4 ]
