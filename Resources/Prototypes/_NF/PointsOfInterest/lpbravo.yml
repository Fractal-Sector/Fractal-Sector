# Notes:
# just a little loot n shoot POI. Pretty much the second POI to even exist
- type: pointOfInterest
  id: LPBravo
  parent: BasePOI
  name: 'Прослушиваемый пункт Браво'
  minimumDistance: 5000
  maximumDistance: 7500
  spawnGroup: SyndicateFOB
  gridPath: /Maps/_NF/POI/lpbravo.yml
  hideWarp: true
  addComponents:
  - type: IFF
    color: "#C83737"
    flags: [HideLabel, Hide]
    readOnly: false
  - type: SyndicateFOB # For pinpointer
  - type: SolarPoweredGrid
    trackOnInit: true
    doNotCull: true

- type: gameMap
  id: LPBravo
  mapName: 'Прослушиваемый пункт Браво'
  mapPath: /Maps/_NF/POI/lpbravo.yml
  minPlayers: 0
  stations:
    LPBravo:
      # FIXME: no records despite shipyard console, could currently be gamed
      stationProto: StandardFrontierOutpost
      gridComponents:
      - type: VesselInfo # WF
        description: "Нет такого места, где бы они тебя не нашли."
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Прослушиваемый пункт Браво'
        - type: StationJobs
          availableJobs: {}
        - type: StationDeadDropHintExempt
        - type: BindToStationVariationPassExemption
