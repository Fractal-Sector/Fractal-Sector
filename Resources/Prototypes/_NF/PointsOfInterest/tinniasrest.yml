    Tinnia:
      stationProto: RecordsFrontierOutpost
      gridComponents:
      - type: VesselInfo # WF
        description: "Сейчас где-то пять часов."
      components:
        - type: StationNameSetup
          mapNameTemplate: "Ресторан «Сытый Карп»"
        - type: ExtraStationInformation
          icon: /Textures/_NF/Interface/StationIcons/bartender.png
          stationSubtext: frontier-lobby-bar-subtext
          stationDescription: frontier-lobby-bar-description
          lobbySortOrder: 7
        - type: StationJobs
          availableJobs:
            Bartender: [ 2, 2 ]
