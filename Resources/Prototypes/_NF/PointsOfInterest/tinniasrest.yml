- type: pointOfInterest
  id: Tinnia
  parent: BasePOI
  name: "Ресторан «Сытый Карп»"
  minimumDistance: 1200
  maximumDistance: 2900
  spawnGroup: Required
  gridPath: /Maps/_NF/POI/tinnia.yml
  addComponents:
