# Gold Leaf

- type: entity
  parent: BaseItem
  id: GoldLeaf
  name: gold leaf
  description: A shimmering golden leaf. It casts a light that conjures dreams of peaceful autumns past. Sell it for money.
  components:
  - type: Sprite
    sprite: _NF/Objects/Misc/valuables.rsi
    state: gold_leaf
  - type: Item
    size: Tiny
  - type: StackPrice
    price: 30
  - type: Stack
    stackType: GoldLeaf
    count: 1

- type: stack
  id: GoldLeaf
  name: goldleaf
  spawn: GoldLeaf1
  maxCount: 30

