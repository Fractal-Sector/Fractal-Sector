- type: reagent
  parent: BasePyrotechnic
  id: CrudeOil
  name: reagent-name-crudeoil
  desc: reagent-desc-crudeoil
  physicalDesc: reagent-physical-desc-viscous
  color: "#1c1813"
  viscosity: 3.0
  recognizable: true
  boilingPoint: 350.0
  meltingPoint: -10.0
  metabolisms:
    Poison:
      effects:
      - !type:HealthChange
        scaleByQuantity: true
        damage:
          types:
            Poison: 3
    Gas:
      effects:
      - !type:HealthChange
        scaleByQuantity: true
        damage:
          types:
            Asphyxiation: 1

- type: reagent
  parent: BasePyrotechnic
  id: Petroleum
  name: reagent-name-petroleum
  desc: reagent-desc-petroleum
  physicalDesc: reagent-physical-desc-gaseous
  color: "#6b757d"
  flavor: bitter
  boilingPoint: -42.0
  meltingPoint: -187.0
  metabolisms:
    Poison:
      effects:
      - !type:HealthChange
        scaleByQuantity: true
        ignoreResistances: true
        damage:
          types:
            Poison: 5
    Gas:
      effects:
      - !type:ModifyLungGas
        conditions:
        - !type:OrganType
          type: Human
        ratios:
          CarbonDioxide: 0.5
          Oxygen: -1.0
      - !type:HealthChange
        conditions:
        - !type:OrganType
          type: Vox
          shouldHave: false
        scaleByQuantity: true
        ignoreResistances: true
        damage:
          types:
            Asphyxiation: 4
            Poison: 2
      - !type:AdjustAlert
        alertType: Toxins
        conditions:
        - !type:ReagentThreshold
          min: 0.2
        clear: true
        time: 4

