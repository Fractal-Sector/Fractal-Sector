  - type: AtmosPipeColor
  - type: OilRefineryPart
    partType: heavy
  - type: PlumbingDevice
    updateInterval: 2
  - type: PlumbingOutlet
    solutionName: buffer
  - type: SolutionContainerManager
    solutions:
