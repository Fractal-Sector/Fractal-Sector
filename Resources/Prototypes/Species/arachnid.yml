- type: species
  id: Arachnid
  name: species-name-arachnid
  roundStart: true
  prototype: MobArachnid
  sprites: MobArachnidSprites
  defaultSkinTone: "#385878"
  markingLimits: MobHumanMarkingLimits #MobArachnidMarkingLimits WF
  dollPrototype: MobArachnidDummy
  skinColoration: Hues
  maleFirstNames: NamesArachnidFirst
  femaleFirstNames: NamesArachnidFirst
  lastNames: NamesArachnidLast
  sexes:
  - Unsexed
  # FS: species window
  category: Classic
  description: "/ServerInfo/_FS/Guidebook/Mobs/Arachnid.xml"
  pros:
  - Не получают дебаффов от передвижения по паутине.
  special:
  - Могут производишь шёлк, взамен голоду.
  - Имеет животный желудок.
  - Получают урон от голода кровотечением и холодом по 0.5 единице в секунду.
  cons:
  - Получают на 50% больше тупого и огненного урона.
  - Получают урон удушьем в 0.5 раз больше. Восстановление происходит в два раза медленней на 0.5 единиц.
  - При низкой температуре получают 0.2 холода в секунду. При высокой температуре получают 0.1 ожога в секунду.
  # FS end

