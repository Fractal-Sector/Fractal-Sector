- type: species
  id: Diona
  name: species-name-diona
  roundStart: true
  prototype: MobDiona
  sprites: MobDionaSprites
  defaultSkinTone: "#cdb369"
  markingLimits: MobHumanMarkingLimits #MobDionaMarkingLimits WF
  dollPrototype: MobDionaDummy
  skinColoration: Hues
  maleFirstNames: NamesDionaFirst
  femaleFirstNames: NamesDionaFirst
  lastNames: NamesDionaLast
  naming: TheFirstofLast
  # FS: species window
  category: Classic
  description: "/ServerInfo/_FS/Guidebook/Mobs/Diona.xml"
  pros:
  - Получает на 0.5 меньше урона от удушья.
  - Получает на 30% меньше тупого и на 20% меньше режущего урона.
  - Голодают и испытывают жажду на 50%~ медленней.
  - Могут дышать углекислым газом.
  - Дышат реже в 2 раза, следовательно без воздуха/углекислого газа получают по 0.5 урона удушьем.
  - Не могут порезаться пройдя по осколкам.
  - Могут самостоятельно реанимироваться, при помощи нимф.
  special:
  - Дионы - растения, они могут употреблять удобрения в качестве лекарств и гербициды в качестве отравы.
  - Cкорость метаболизма - 0.05 единиц. Это означает, что они усваивают всё намного медленнее, чем другие расы.
  - Получают урон от голода кровотечением по 0.5 единиц в секунду.
  - Не могут носить обувь.
  cons:
  - Получает на 50% больше урона огнём и 20% электричеством.
  - Не может бегать.
  - Легко возгораемые.
  # FS end

