- type: entity
  id: BananiumReactorFuelRod
  parent: BaseReactorFuelRod
  name: бананиумовый топливный стержень
  description: Хонк-топливный стержень.
  components:
  - type: ReactorPart
    material: Bananium

- type: entity
  id: PlasmaReactorFuelRod
  parent: BaseReactorFuelRod
  name: плазмовый топливный стержень
  components:
  - type: ReactorPart
    material: Plasma

- type: entity
  id: UraniumGlassReactorFuelRod
  parent: BaseReactorFuelRod
  name: топливный стержень из уранового стекла
  components:
  - type: ReactorPart
    material: UraniumGlass

- type: entity
  id: MeatReactorFuelRod
  parent: BaseReactorFuelRod
  suffix: Admeme
  name: мясной топливный стержень
  description: Топливный стержень для- постой, оно живое?
  components:
  - type: ReactorPart
    material: Meaterial
    properties:
      electrical: 4
      hard: 1
      density: 3
      flammable: 3
      radioactive: 5

