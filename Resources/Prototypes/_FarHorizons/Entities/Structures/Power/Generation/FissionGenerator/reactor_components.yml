- type: entity
  id: BaseReactorItem
  parent: BaseItem
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _FarHorizons/Structures/Power/Generation/FissionGenerator/reactor_parts.rsi
    state: default_rod
  - type: Item
    size: Huge
  - type: MultiHandedItem
  - type: Tag
    tags:
    - ReactorPart
  - type: GuideHelp
    guides:
    - NuclearReactor
    - Power

- type: entity
  id: BaseReactorPart
  abstract: true
  parent: BaseReactorItem
  components:
  - type: ReactorPart

# Fuel Rods
- type: entity
  id: BaseReactorFuelRod
  parent: [ BaseReactorPart ]
  categories: [ HideSpawnMenu ]
  name: топливный стержень
  description: Топливный стержень для ядерного реактора.
  components:
  - type: ReactorPart
    rodType: 1
    iconStateInserted: "fuel"
    iconStateCap: "fuel_cap"
    neutronCrossSection: 1.0
    thermalCrossSection: 10
    thermalMass: 420000 # specific heat capacity of steel (420 J/KgK) * mass of component (1000Kg)
  - type: SentienceTarget
    flavorKind: station-event-random-sentience-flavor-inanimate
    weight: 0.2

- type: entity
  id: CerenkiteReactorFuelRod
  parent: BaseReactorFuelRod
  name: черенкитовый топливный стержень  # These are your basic, semi-harmless fuel rods
  components:
  - type: ReactorPart
    material: Cerenkite

- type: entity
  id: UraniumReactorFuelRod
  parent: BaseReactorFuelRod
  name: урановый топливный стержень 
  components:
  - type: ReactorPart
    material: Uranium

- type: entity
  id: PlutoniumReactorFuelRod
  parent: BaseReactorFuelRod
  name: плутониевый топливный стержень
  components:
  - type: ReactorPart
    material: Plutonium
  #- type: GhostRole # Wayfarer: Why?
