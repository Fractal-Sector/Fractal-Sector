- type: entity
  id: NuclearFabricatorMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: плата ядерного фабрикатора
  description: Плата печатной схемы для ядерного фабрикатора.
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: NuclearFabricator
    requirements:
      MatterBin: 2 # Wayfarer: Adds it for material efficiency.
      Manipulator: 2 # Wayfarer: 5<2
    stackRequirements:
      Glass: 3

- type: entity
  id: NuclearCentrifugeMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: плата ядерной центрифуги
  description: Плата печатной схемы для ядерной центрифуги.
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: NuclearCentrifuge
    requirements:
      Manipulator: 5
    stackRequirements:
      Plasteel: 5
