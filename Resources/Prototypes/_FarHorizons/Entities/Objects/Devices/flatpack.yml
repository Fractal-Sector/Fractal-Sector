- type: entity
  parent: [BaseFlatpack]
  id: NuclearReactorFlatpack
  name: компактный ядерный реактор
  description: Компактный набор для сборки ядерного реактора. Комплектующие продаются отдельно.
  components:
  - type: Sprite
    layers:
    - state: ame-part
  - type: Flatpack
    entity: NuclearReactorEmpty

- type: entity
  parent: [BaseFlatpack]
  id: GasTurbineFlatpack
  name: компактный газотурбинный модуль
  description: Компактный набор для сборки газовой турбины.
  components:
  - type: Sprite
    layers:
    - state: ame-part
  - type: Flatpack
    entity: Turbine

- type: entity
  parent: [BaseFlatpack]
  id: SmallNuclearReactorFlatpack  # HL
  name: компактный ядерный реактор
  description: Компактный набор для сборки малого ядерного реактора. Теперь в уменьшенном размере! Комплектующие по-прежнему продаются отдельно.
  components:
  - type: Sprite
    layers:
    - state: ame-part
  - type: Flatpack
    entity: NuclearReactorSmallEmpty

- type: entity
  parent: [BaseFlatpack]
  id: GasTurbineSmallFlatpack # HL
  name: малый газотурбинный модуль
  description: Компактный набор для сборки малой газовой турбины. Теперь в уменьшенном размере!
  components:
  - type: Sprite
    layers:
    - state: ame-part
  - type: Flatpack
    entity: TurbineSmall
