- type: entity
  name: сырое филе абиссального карпа
  parent: FoodMeatFish
  id: FoodMeatAbyssalFish
  description: Темнее, насыщеннее... с удивительно притягательным оттенком.
  components:
  - type: FlavorProfile
    flavors:
    - bitter
    - salty
  - type: Sprite
    sprite: _starcup/Objects/Consumable/Food/meat.rsi
    state: abyssalfish
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: CarpoToxin
          Quantity: 8
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: CarpoToxin
        Quantity: 8
  - type: Item
    inhandVisuals:
      left:
      - state: abyssal-inhand-left
      right:
      - state: abyssal-inhand-right

