- type: species
  id: Felinid
  name: species-name-felinid
  roundStart: true
  prototype: MobFelinid
  sprites: MobHumanSprites
  markingLimits: MobFelinidMarkingLimits
  dollPrototype: MobFelinidDummy
  skinColoration: Hues # Wayfarer: HumanToned<Hues
  # FS: species window
  category: Unusual
  description: "/ServerInfo/Guidebook/Mobs/_DV/Felinid.xml"
  pros:
  - Они меньше людей, из-за чего по ним сложнее попасть.
  - Могут есть мышей и крыс, просто подобрав их. Это восстанавливает способность отрыгивать шерсть и насыщает персонажа.
  - Могут помещаться в вещмешки.
  special:
  - Не издают звуков ходьбы, если не носят обуви.
  - Отхаркивают комок шерсти.
  cons:
  - Получают на 15% больше тупого, режущего и колющего урона.
  - Они слабее и с трудом переносят или тащат вещи из-за своего малого роста. Неспособны тащить Они.
  # FS end

- type: markingPoints
  id: MobFelinidMarkingLimits
  points:
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 1
      required: false
    Tail:
      points: 1
      required: true
      defaultMarkings: [ FelinidTailBasic ]
    HeadTop:
      points: 1
      required: true
      defaultMarkings: [ FelinidEarsBasic ]
    Chest:
      points: 4 # Frontier 1<4
      required: false
    Legs:
      points: 8 # Frontier 2<8
      required: false
    Arms:
      points: 8 # Frontier 2<8
      required: false
    # Frontier: apparently these don't exist on Delta
    UndergarmentTop:
      points: 3
      required: false
    UndergarmentBottom:
      points: 3
      required: false
    # End Frontier
