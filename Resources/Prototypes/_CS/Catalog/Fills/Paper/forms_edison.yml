      [head=2][color=#F9B34F]Новый проект: Верфь Эдисона[/color][/head]
      [color=#E47A1F][italic]Обслуживание шаттлов с 2526 года.[/italic][/color]

      Вышеупомянутая станция была заменена совершенно новым, переработанным проектом, предоставленным главным архитектором. Они работали совместно с дизайнерами из компании Electra, бывшими сотрудниками Эдисона и администрацией сектора Зекке, и проект считается удовлетворительным для своих целей.

      Ниже приведён список ключевых особенностей. Территория была модернизирована для повышения удобства использования как для персонала, так и для посетителей. Кроме того, были сделаны пристройки для полного размещения и использования ядерного реактора. Квалифицированный специалист по ядерной энергетике С. Илии, доктор философии, в настоящее время имеет лицензию на проведение испытаний на объекте.

      [head=3][color=#F9B34F][bold]Станция обладает следующими характеристиками:[/bold][/color][/head]
      [bullet] Отремонтированная зона лобби
      [bullet] Динамические газовые залежи (все причалы, обозначенные цифрой 6, обеспечивают подачу газа в хранилище).
      [bullet] Добыча кислорода и азота
      [bullet] Дополнительные камеры сгорания для синтеза газа
      [bullet] Корректировка тарифа продажи газа (теперь в 1,5 раза выше рыночной цены)
      [bullet] Тесла и сдерживание сингулярности (ожидается проверка)
      [bullet] Ядерный энергоблок
      [bullet] Полный док для судна и оборудование.
      [bullet] Специализированный латы для обслуживания шаттлов с начала смены.


      [color=gray][italic]Компания Electra Dynamics™ не несет ответственности за причинение вреда людям во время работы установки "Гравитационная сингулярность". Использование звуковых систем с уровнем шума выше 3 дюймов аннулирует гарантию на здание. Эксплуатация ядерного реактора не допускается для неквалифицированных специалистов; при работе вблизи реактор необходим хазмат. Мы надеемся, что вы останетесь довольны своей покупкой. Electra Dynamics™ PLC, основано в 2322 году, патент № 523.[/italic]
